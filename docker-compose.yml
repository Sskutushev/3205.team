services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3000
      QUEUE_DRIVER: memory
      # Defaults to in-memory. Switch to shared Redis state with:
      #   STORAGE_DRIVER=redis docker compose --profile scale up --build
      STORAGE_DRIVER: ${STORAGE_DRIVER:-memory}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - '3000:3000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '8080:80'

  redis:
    image: redis:7-alpine
    profiles: ['scale']
    ports:
      - '6379:6379'

  postgres:
    environment:
      POSTGRES_DB: url_checker
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    image: postgres:17-alpine
    profiles: ['sql']
    ports:
      - '5432:5432'
